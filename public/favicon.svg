<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="70%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#E5A800" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D1F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF2800" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ferrari Shield Outline -->
  <path d="M 12 10 L 88 10 L 88 62 C 88 88 50 114 50 114 C 50 114 12 88 12 62 Z" 
        fill="url(#shieldGrad)" 
        stroke="#111111" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Trim -->
  <path d="M 16 14 L 84 14 L 84 60 C 84 83 50 107 50 107 C 50 107 16 83 16 60 Z" 
        fill="none" 
        stroke="#E5A800" 
        stroke-width="1.2" 
        opacity="0.6" />

  <!-- Italian Tricolore Top Bar -->
  <g>
    <!-- Green -->
    <rect x="14" y="10.5" width="24" height="8" fill="#008C45" />
    <!-- White -->
    <rect x="38" y="10.5" width="24" height="8" fill="#FFFFFF" />
    <!-- Red -->
    <rect x="62" y="10.5" width="24" height="8" fill="#CD212A" />
    <!-- Divider lines -->
    <line x1="14" y1="18.5" x2="86" y2="18.5" stroke="#111111" stroke-width="1.5" />
  </g>

  <!-- Prancing Horse / AJ Monogram Silhouette -->
  <!-- Stylized Stallion Silhouette & AJ Typography -->
  <g fill="#111111">
    <!-- Horse head and mane -->
    <path d="M 52 26 C 54 24 57 23 59 25 C 61 27 60 30 57 32 C 55 33 53 31 52 30 C 51 28 50 27 52 26 Z" />
    <path d="M 56 26 C 53 28 51 32 49 37 C 47 42 46 45 44 48 C 42 46 42 43 45 38 C 47 34 51 28 56 26 Z" />
    <!-- Horse rearing body & front hooves -->
    <path d="M 55 33 C 58 35 62 38 66 36 C 68 35 70 33 68 31 C 66 32 63 33 60 31 C 57 30 55 32 55 33 Z" />
    <path d="M 53 38 C 58 41 64 45 68 46 C 70 46 72 44 71 42 C 68 42 64 39 60 37 C 56 36 53 37 53 38 Z" />
    <!-- Torso and arched back -->
    <path d="M 48 41 C 51 43 54 48 55 54 C 55 60 53 66 49 71 C 47 67 47 60 48 53 C 48 47 47 43 48 41 Z" />
    <!-- Hind legs and tail -->
    <path d="M 49 68 C 52 72 55 78 54 84 C 53 87 51 89 49 89 C 48 89 48 86 50 82 C 51 77 49 72 47 70 Z" />
    <path d="M 47 69 C 43 74 38 81 38 87 C 38 89 40 89 41 87 C 43 83 45 78 48 72 Z" />
    <!-- Flowing Tail -->
    <path d="M 46 56 C 41 59 36 65 35 73 C 34 77 36 78 37 75 C 39 70 43 64 47 60 Z" />
  </g>

  <!-- AJ Scuderia Letters at the bottom of shield -->
  <g fill="#111111" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="3" text-anchor="middle">
    <text x="52" y="99">AJ</text>
  </g>

  <!-- Subtle Shield Highlight Gloss -->
  <path d="M 18 19 L 45 19 C 30 45 22 65 20 70 C 18 64 18 55 18 19 Z" 
        fill="#FFFFFF" 
        opacity="0.25" />
</svg>
